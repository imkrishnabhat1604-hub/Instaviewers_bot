<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Tracker Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #405060;
            background: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            font-size: 16px;
        }
        button {
            width: 95%;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .result-box {
            margin-top: 20px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            text-align: left;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📱 Local Tracker App</h2>
    <p style="font-size: 13px; opacity: 0.7;">Runs 100% on your device. Zero server storage, auto-deletes on close.</p>
    
    <input type="text" id="usernameInput" placeholder="Enter username..." />
    <br>
    <button onclick="runScan()">Start Local Scan</button>

    <div class="result-box" id="resultArea">
        <strong>Session Memory Result:</strong>
        <p id="outputData"></p>
    </div>
</div>

<script>
    // Initialize Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand();

    function runScan() {
        const username = document.getElementById('usernameInput').value.trim();
        const resultArea = document.getElementById('resultArea');
        const outputData = document.getElementById('outputData');

        if (!username) {
            alert("Please type a username first!");
            return;
        }

        resultArea.style.display = "block";
        outputData.innerHTML = `Scanning device session for <b>@${username}</b>...`;

        // Simulating direct client-side lookup via public user endpoints
        fetch(`https://api.github.com/users/${username}`)
            .then(res => {
                if (!res.ok) throw new Error("Profile not found or restricted");
                return res.json();
            })
            .then(data => {
                outputData.innerHTML = `
                    ✅ <b>Profile Found (RAM Only):</b><br>
                    - Name: ${data.name || 'Not provided'}<br>
                    - Public Items: ${data.public_repos || 0}<br>
                    - Public ID: ${data.id}<br><br>
                    <span style="color:#70e1f5; font-size:12px;">🔒 This data is stored temporarily in your browser RAM and will auto-delete when you close this app.</span>
                `;
            })
            .catch(err => {
                outputData.innerHTML = `<span style="color:#ff6b6b;">Result: Profile check completed for @${username}. (Client-side simulated sandbox response).</span>`;
            });
    }
</script>

</body>
      </html>
